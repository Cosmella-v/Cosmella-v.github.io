<!DOCTYPE html>
<html lang="en">

<head>
    
    <meta charset="UTF-8" />
    <link rel="icon" href="https://avatars.githubusercontent.com/u/100521306?v=4">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cosmella's Site</title>
    <style>
        
        ::-webkit-scrollbar {
            width: 0px;
            height: 0px;
        }


        body::-webkit-scrollbar {
            display: none;
            overflow: -moz-scrollbars-none;
        }

        h1,
        h2 {
            color: #ffffff;
        }
       
        body {
            -ms-overflow-style: none;
            scrollbar-width: none;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
            overflow-x: hidden; /* prevent horizontal scroll */
            overflow-y: auto;
            padding-bottom: 5px; /*fix scrolling not going far enough*/
            position: relative;
        }
       @keyframes flow { /* ughh math*/
            0% {
                background-position: 0% 0%;
            }
           16.67% {
                background-position: 50% 100%;
            }
            33.33% {
                background-position: 100% 50%;
            }
            50% {
                background-position: 100% 100%;
            }
            66.67% {
                background-position: 50% 100%;
            }
            83.33% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 0%;
            }
        }

        body::before {
            content: "";
            position: fixed;
            inset: -50px;

           background: /* based on a gradent from https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/Values/gradient/radial-gradient */
                radial-gradient(circle at top, #380474, transparent 70%),
                radial-gradient(circle at right, #004d00, transparent 70%),
                radial-gradient(ellipse at bottom, #db64e6, transparent),
                radial-gradient(ellipse at left, #4d9f0c, transparent),
                #000000;

            background-size: 200% 200%;
            animation: flow 50s ease-in-out infinite;

            z-index: -2;
        }
        .glass-card {
            width: 440px;
            height: 360px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 8px 32px 0 rgba(164, 211, 168, 0.2);
            border-radius: 20px;
            opacity: 0.8;
            z-index: 1;
            animation: float 6s infinite alternate;
            position: relative;
            overflow: auto;
        }

        .list-container, .button-list {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            background: transparent;
            padding-bottom: 5px; /*fix scrolling not going far enough*/
        }

        .custom-btn, .link-button {
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            background: rgba(255, 255, 255, 0.1);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border-color: rgba(255, 255, 255, 0.4);
            border-radius: 12px;
            color: white;
            font-weight: 600;
            font-size: clamp(0.7rem, 2vw, 0.7rem);
            padding: 10px 24px;
            cursor: pointer;
            transition: background 0.3s ease, border-color 0.3s ease, transform 0.15s ease;
            width: 200px;
            text-align: left
        }

        .btn-icon {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }
        .custom-btn:hover, .link-button:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(222, 255, 222, 0.4);
            transform: translateY(-2px);
        }

        .custom-btn:active, .link-button:active {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(0);
        }

        .custom-btn:focus, .link-button:focus {
            outline: none;
        }

        .button-list {
            gap: 16px;
            padding-top: 10px;
        }
        .spotify-card {
            display: inline-block;
            padding: 12px;
            border-radius: 20px;

            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);

            border: 1px solid rgba(255, 255, 255, 0.18);

            box-shadow:
            0 8px 32px rgba(0, 0, 0, 0.35),
            inset 0 1px 1px rgba(255, 255, 255, 0.12);
        }

        .spotify-card img {
            display: block;
            width: 100%;
            max-width: 500px;

            border-radius: 14px;

            filter: blur(0.3px) saturate(1.1);
            mix-blend-mode: multiply;

            opacity: 0.95;
        }
    </style>
</head>

<body>
    <div class="spotify-card"         style = "bottom: 80px; right: 80px; top: 300px; left: 120px;">
    <img 
        src="https://spotify-recently-played-readme.vercel.app/api?user=31ba4npdeg5oazuyrctq4ruozoae&count=3&unique=true"
        alt="Spotify recently played"
    />
    </div>
    <div class="list-container"  style = "bottom: 80px; right: 80px; top: 300px; left: 120px;">
        <div class="glass-card">
            <iframe id="Cosmella-profile" src="https://Cosmella-v.github.io/lanyard_Embeder/?id=764832218115080222&DarkMode=true"
                sandbox="allow-scripts allow-same-origin allow-modals" width="100%" height="100%"
                style="border: none; margin: 0; padding: 0; display: block; overflow: auto; border-radius: 20px;">
            </iframe>
        </div>
        <div class="glass-card" style="width: 300px;">
            <div class="button-list">
                <button class="link-button"  id="Youtube" link="https://www.youtube.com/channel/UC3A8dtlO94rHEkn4Kz7aB7g">
                    <img src="https://cdn.simpleicons.org/youtube" alt="icon" class="btn-icon" />
                    Viper
                </button>
                <button class="link-button"  id="Spotify" link = "https://open.spotify.com/user/31ba4npdeg5oazuyrctq4ruozoae">
                    <img src="https://cdn.simpleicons.org/spotify" alt="icon" class="btn-icon" />
                    Viper
                </button>
                 <button class="link-button"  id="Codeburg" link="https://codeberg.org/Cosmella-v">
                    <img src="https://design.codeberg.org/logo-kit/icon.svg" alt="icon" class="btn-icon" />
                    Cosmella (@Cosmella-v)
                </button>
                <button class="link-button"  id="Github" link="https://github.com/Cosmella-v">
                    <img src="https://cdn.simpleicons.org/github" alt="icon" class="btn-icon" />
                    Viper (@Cosmella-v)
                </button>
                <button class="link-button"  id="Steam" link="https://steamcommunity.com/profiles/76561199093028507">
                    <img src="https://cdn.simpleicons.org/steam" alt="icon" class="btn-icon" />
                    Viper
                </button>
                <button class="link-button"  id="Profile" link="https://www.roblox.com/users/530829101/profile">
                    <img src="https://cdn.simpleicons.org/roblox" alt="icon" class="btn-icon" />
                    Viper (@Viper_Protogen)
                </button>
                <button class="link-button"  id="Script-Blox" link = "https://scriptblox.com/u/Viper">
                    <img src="https://r2.guns.lol/7e671c9b-1689-4d72-a5e5-b972f7d7fb09.png" alt="icon"
                        class="btn-icon" />
                    Viper
                </button>
            </div>
        </div>
    </div>
</body>

<script>
    // this is way better for buttons lol
    const linkbtns = document.getElementsByClassName("link-button")
    for (let i = 0; i < linkbtns.length; i++) {
        let button = linkbtns[i]
        if (button && button.getAttribute("link")) {
            const link = button.getAttribute("link")
            button.onclick = function() {
                window.open(`${link}?ref=Cosmella-v`, "_blank");
            }
        }
    }
</script>

<script>
    // injects into the IFrame
    const iframe = document.getElementById('Cosmella-profile');
        const cs = `
        .profile-card, .activity, .profile-info h2, .profile-info p, .avatar .profile, h1, h2, p {
            color: #ffffff;
            background: initial!important;
        }
        
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: overflow;
            background: initial!important;
        }
        ::-webkit-scrollbar {
                width: 0px;
                height: 0px;
        }
        body::-webkit-scrollbar {
                display: none;
                overflow: -moz-scrollbars-none;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .activity {
            box-shadow: 0 8px 32px 0 rgba(164, 211, 168, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
            border-radius: 12px;
            -webkit-backdrop-filter: blur(5px);
            border-color: rgba(222, 255, 222, 1);
            backdrop-filter: blur(5px);
        }

    .profile-card {
        width: 100vw;
        height: 100%;
        box-shadow: 0 0px 0px 0 rgba(164, 211, 168, 0);
        
        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px);
        border-radius: 0;
        border: 0px solid rgba(255, 255, 255, 0);
    }
    .slider .progress {
        background: #a83dff;
    }
    .profile-info {
        width: 100%;
        overflow: auto; 
        background: transparent;
        box-sizing: border-box;
        padding: 20px; 
        scrollbar-width: none; 
        overflow: hidden;
        text-overflow: ellipsis;
        -ms-overflow-style: none;  
    }
    .profile-info::-webkit-scrollbar {
        display: none;  /* Chrome, Safari, Opera */
    }
    `
    iframe.addEventListener('load', () => {
        console.log('injected theming');
        iframe.contentWindow.postMessage({ type: 'css', content: cs }, '*');
    });

</script>

</html>
