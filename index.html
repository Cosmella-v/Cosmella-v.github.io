<!DOCTYPE html>
<html lang="en">

<head>
    
    <meta charset="UTF-8" />
    <link rel="icon" href="https://avatars.githubusercontent.com/u/100521306?v=4">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cosmella's Site</title>
    <style>
        
        ::-webkit-scrollbar {
            width: 0px;
            height: 0px;
        }

        body {
            -ms-overflow-style: none;
            scrollbar-width: none;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
            overflow: hidden;
            position: relative;
        }

        body::-webkit-scrollbar {
            display: none;
            overflow: -moz-scrollbars-none;
        }

        h1,
        h2 {
            color: #ffffff;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;

            background:
                linear-gradient(135deg, #1b1b1b, #004d00);

            background-size: cover;
            z-index: -2;
        }

        .glass-card {
            width: 440px;
            height: 360px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 8px 32px 0 rgba(164, 211, 168, 0.2);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 20px;
            opacity: 0.8;
            z-index: 1;
            animation: float 6s infinite alternate;
            position: relative;
            overflow: auto;
        }

        .list-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .custom-btn {
            background: rgba(255, 255, 255, 0.1);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 8px 32px 0 rgba(164, 211, 168, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
            border-radius: 12px;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            padding: 10px 24px;
            cursor: pointer;
            transition: background 0.3s ease, border-color 0.3s ease, transform 0.15s ease;
            width: 200px;
            text-align: left
        }

        .btn-icon {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }
        .custom-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(222, 255, 222, 0.4);
            transform: translateY(-2px);
        }

        .custom-btn:active {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(0);
        }

        .custom-btn:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(0, 255, 100, 0.6);
        }

        .button-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
            padding-top: 10px;
        }
        .spotify-card {
            display: inline-block;
            padding: 12px;
            border-radius: 20px;

            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);

            border: 1px solid rgba(255, 255, 255, 0.18);

            box-shadow:
            0 8px 32px rgba(0, 0, 0, 0.35),
            inset 0 1px 1px rgba(255, 255, 255, 0.12);
        }

        .spotify-card img {
            display: block;
            width: 100%;
            max-width: 500px;

            border-radius: 14px;

            filter: blur(0.3px) saturate(1.1);

            opacity: 0.95;
        }
    </style>
</head>

<script>
    // injects into the IFrame
    const iframe = document.getElementById('Cosmella-profile');

    const JS = `
   function ProfileAdded(avatarImg) {
        const wrapper = document.createElement('span');
        wrapper.style.display = 'inline-flex';
        wrapper.style.alignItems = 'left';
        wrapper.style.padding = '8px';

        avatarImg.parentElement.insertBefore(wrapper, avatarImg);

        const newImg1 = document.createElement('img');
        newImg1.src = avatarImg.src;
        newImg1.alt = "profile";
        newImg1.style.width = avatarImg.style.width;
        newImg1.style.height =  avatarImg.style.height;

        const newImg2 = document.createElement('img');
        newImg2.src = 'https://cosmella-v.github.io/other-icon.png';
        newImg2.alt = 'Other icons stuff';
        newImg2.style.width = newImg1.style.width;
        newImg2.style.height = newImg1.style.height;

        wrapper.appendChild(newImg1);
        wrapper.appendChild(newImg2);
        avatarImg.remove();
    }

    const observer = new MutationObserver((mutations) => {
        mutations.forEach(mutation => {
            mutation.addedNodes.forEach(node => {
                if (node.nodeType === 1) { 
                    if (node.tagName === 'IMG' && node.alt && node.alt.includes("cosmella_v's avatar")) {
                        ProfileAdded(node);
                    } else {
                        const imgs = node.querySelectorAll("img[alt*=\\"cosmella_v's avatar\\"]");
                        imgs.forEach(img => ProfileAdded(img));
                    }
                }
            });
        });
    });

    observer.observe(document.body, {
        childList: true,
        subtree: true
    });
`;
    const cs = `
     .profile-card, .activity, .profile-info h2, .profile-info p {
                        color: #ffffff;
                    }
    html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: overflow;
    }
    ::-webkit-scrollbar {
            width: 0px;
            height: 0px;
    }
    body::-webkit-scrollbar {
            display: none;
            overflow: -moz-scrollbars-none;
    }
    body {
        display: flex;
        align-items: center;
        justify-content: center;
        -ms-overflow-style: none;
        scrollbar-width: none;
        background: rgba(255, 255, 255, 0);
    }
    .activity {
        background: rgba(0,77,0, 0.2);
        box-shadow: 0 8px 32px 0 rgba(164, 211, 168, 0.2);
        border-color: rgba(255, 255, 255, 0.4);
        border-radius: 12px;
        -webkit-backdrop-filter: blur(11px);
        border-color: rgba(222, 255, 222, 1);
        backdrop-filter: blur(11px);
    }

   .profile-card {
    width: 100vw;
    height: 100%;
    background: rgba(12, 255, 24, 0.2);
    box-shadow: 0 8px 32px 0 rgba(164, 211, 168, 0.2);
    
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
    border-radius: 0;
    border: 1px solid rgba(255, 255, 255, 0.03);
    position: relative;
    overflow: auto;
    flex-direction: column;
}
.slider .progress {
    background: #a83dff;
}
.profile-info {
    flex: 1 1 auto; 
    width: 100%;
    overflow: auto; 
    background: transparent;
    box-sizing: border-box;
    padding: 20px; 
    scrollbar-width: none; 
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    -ms-overflow-style: none;  
}
.profile-info::-webkit-scrollbar {
    display: none;  /* Chrome, Safari, Opera */
}
`
    iframe.addEventListener('load', () => {
        console.log('injected theming');
        iframe.contentWindow.postMessage({ type: 'inject-js', js: JS }, '*');
        iframe.contentWindow.postMessage({ type: 'inject-css', css: cs }, '*');
    });

</script>

</html>
