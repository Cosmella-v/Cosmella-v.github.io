            0% {
                background-position: 0% 0%;
            }

            16.67% {
                background-position: 50% 100%;
            }

            33.33% {
                background-position: 100% 50%;
            }

            50% {
                background-position: 100% 100%;
            }

            66.67% {
                background-position: 50% 100%;
            }

            83.33% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 0%;
            }
        }

        body::before {
            content: "";
            position: fixed;
            inset: -50px;

            background:
                /* based on a gradent from https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/Values/gradient/radial-gradient */
                radial-gradient(circle at top, #380474, transparent 70%),

                radial-gradient(ellipse at left, #4d9f0c, transparent),

        }

        }

        .list-container {

            flex-direction: column;
            align-items: center;
            gap: 16px;
            background: transparent;
            padding-bottom: 8px;
            /*fix scrolling not going far enough*/
            width: clamp(240px, 90vw, 440px);
        }

            transition: background 0.3s ease, border-color 0.3s ease, transform 0.15s ease;
            width: clamp(160px, 70vw, 200px);
            text-align: left

        .btn-icon {
            width: 24px;

        .custom-btn:hover,

        .spotify-card .content,

<script>
    const URL = "/projects.json";
    let responseTags = {}
    const showInfo = (repo, data) => {
        const card = document.createElement("div");
        card.className = "project-card";

        const icon = document.createElement("img");
        const getPlatformIcon = (repo) => {
            if (repo.includes("github.com")) {
                return "https://cdn.simpleicons.org/github";
            }
            if (repo.includes("codeberg.org")) {
                return "https://design.codeberg.org/logo-kit/icon.svg";
            }
            if (repo.includes("git.eclipse.menu")) {
                return "https://git.eclipse.menu/assets/img/logo.svg";
            }
            if (repo.includes("git.gay")) {
                return "https://git.gay/assets/img/logo.svg";
            }
            return "https://git-scm.com/images/logo@2x.png";
        };
        if (data.image) {
            icon.src = data.image
            icon.className = "project-icon";
        } else {
            icon.src = getPlatformIcon(repo);
            icon.className = "project-small-icon";
        }
        if (!Number(repo)){ // is it a link
            icon.onclick = function () {
                window.open(`${repo}?ref=Cosmella-v`, "_blank");
            }
        } else {
             if (data.image) {
                window.open(`${data.image}?ref=Cosmella-v`, "_blank");
             }
        }

        const name = document.createElement("span");
        name.className = "project-name";
        name.textContent = data.title||"";

        const details = document.createElement("span");
        details.className = "project-details";
        details.textContent = data.details||"";

        const tags = document.createElement("div");
        tags.className = "project-tags";

        for (const tag of data.tags) {
            const tagElement = document.createElement("span");
            console.log(responseTags, tag);
            const taginfo = responseTags[tag] || {}
            tagElement.title = taginfo.hover || "";
            tagElement.className = "project-tag";
            const image = document.createElement("img");
            image.className = "tag-image";
            image.src =  taginfo.icon || "";
            tagElement.append(image, document.createTextNode(taginfo.text || tag));
            tags.append(tagElement);
        }

        card.append(icon, name, details, tags);

        return card;
    };
    // projects
    const projects = document.querySelectorAll(".projects");
    fetch(URL)
        .then(response => response.json())
        .then(data => {
            responseTags = data.tags || tags
            for (let i = 0; i < projects.length; i++) {

                let object = projects[i];

                if (object) {
                    for (const [id, project] of Object.entries(data.projects || {})) {
                        object.append(showInfo(id, project));
                    }
                }
            }
        })
        .catch(error => {
            console.error(error);
        });
</script>

<script>
    // this is way better for buttons lol
    const linkbtns = document.getElementsByClassName("link-button")
    for (let i = 0; i < linkbtns.length; i++) {
        let button = linkbtns[i]
        if (button && button.getAttribute("link")) {
            const link = button.getAttribute("link")
            button.onclick = function () {
                window.open(`${link}?ref=Cosmella-v`, "_blank");
            }
        }
    }
    const expandables = document.getElementsByClassName("expandable")
    for (let i = 0; i < expandables.length; i++) {
        let element = expandables[i]
        if (element && element.getAttribute("x")) {
            let winsize = [window.innerWidth, window.innerWidth * (Number(element.getAttribute("x")) || 0)]
            const handleFunction = (position) => {
                if (winsize[0] !== window.innerWidth) {
                    winsize[0] = window.innerWidth;
                    winsize[1] = window.innerWidth * (Number(element.getAttribute("x")) || 0)
                    //console.log(element,"is recalcuting! screen size changed!!!")
                }
                if (position > winsize[1]) {
                    element.classList.add("expanded");
                } else {
                    element.classList.remove("expanded");
                }
            }
            document.addEventListener("mousemove", (e) => {
                handleFunction(e.clientX)
            })
            document.addEventListener("touchmove", function (e) {
                handleFunction(e.changedTouches[0].clientX)
            })
        }
    }
</script>
